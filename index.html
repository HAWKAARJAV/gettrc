<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0F2557" />

    <!-- Applies saved/system theme before first paint to avoid a flash of
         the wrong theme. Kept tiny and inline (not a bundled module) since
         it must run before any CSS/JS chunk loads. -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("trc_theme");
          var theme = saved === "light" || saved === "dark"
            ? saved
            : (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
          document.documentElement.setAttribute("data-theme", theme);
        } catch (e) {}
      })();
    </script>

    <title>TRC Connect — UAE Tax Residency Certificate Platform</title>
    <meta name="description" content="Get your UAE Tax Residency Certificate (TRC) with TRC Connect. Verified Chartered Accountants handle eligibility review, document collection, and FTA filing for individuals and companies." />

    <link rel="canonical" href="https://gettrc.com/" />

    <!-- Favicons -->

    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- OpenGraph -->

    <meta property="og:description" content="Get your UAE Tax Residency Certificate (TRC) with TRC Connect. Verified Chartered Accountants handle eligibility review, document collection, and FTA filing for individuals and companies." />
